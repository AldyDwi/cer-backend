services:
# Database service
  db:
    image: mysql:8.0
    container_name: reka_cer_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reka_cer
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_USER: reka_user
      MYSQL_PASSWORD: reka_password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - reka_cer_network

  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reka_cer_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - reka_cer_network

  # Web server service
  webserver:
    image: nginx:alpine
    container_name: reka_cer_nginx
    restart: unless-stopped
    ports:
      - "8001:80" # Diubah dari 80:80 agar tidak bentrok dengan Nginx Host
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - reka_cer_network

  # Reverb service
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reka_cer_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080" # Dipublish ke host untuk WebSocket Reverb
    volumes:
      - .:/var/www
    depends_on:
      - app
    networks:
      - reka_cer_network

networks:
  reka_cer_network:
    driver: bridge

volumes:
  dbdata:
    driver: local