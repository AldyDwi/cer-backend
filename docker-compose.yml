services:
  # Container Database MySQL
  db:
    image: mysql:8.0
    container_name: reka_cer_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reka_cer
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_USER: reka_user
      MYSQL_PASSWORD: reka_password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - reka_cer_network  # Container Aplikasi Utama (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reka_cer_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - reka_cer_network

  # Container Web Server Nginx
  webserver:
    image: nginx:alpine
    container_name: reka_cer_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - reka_cer_network

  # Container Khusus Laravel Reverb (WebSocket)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reka_cer_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    expose:
      - "8080"
    volumes:
      - .:/var/www
    depends_on:
      - app
    networks:
      - reka_cer_network

volumes:
  dbdata:
    driver: local

networks:
  reka_cer_network:
    driver: bridge