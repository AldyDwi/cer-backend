version: '3.8'

services:
  # Container Aplikasi Utama (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reka_cer_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - reka_cer_network

  # Container Web Server Nginx
  webserver:
    image: nginx:alpine
    container_name: reka_cer_nginx
    restart: unless-stopped
    ports:
      - "80:80"      # Diubah ke 80 agar langsung melayani HTTP di VPS
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - reka_cer_network

  # Container Khusus Laravel Reverb (WebSocket)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reka_cer_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    # Port 8080 cukup internal di dalam network Docker
    expose:
      - "8080"
    volumes:
      - .:/var/www
    depends_on:
      - app
    networks:
      - reka_cer_network

networks:
  reka_cer_network:
    driver: bridge