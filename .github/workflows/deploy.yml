
name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

# Hindari dua deployment berjalan bersamaan.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e

            cd /var/www/backend-reka-cer

            git config --global --add safe.directory /var/www/backend-reka-cer

            echo "Pulling latest code..."
            git pull --ff-only origin main

            echo "Installing Composer dependencies..."
            docker compose exec -T app \
              composer install --no-interaction \
              --prefer-dist --optimize-autoloader --no-dev

            echo "Running database migrations..."
            docker compose exec -T app php artisan migrate --force

            echo "Rebuilding Laravel caches..."
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache

            echo "Restarting application services..."
            docker compose restart app reverb

            echo "Deployment completed successfully."
